{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{% static 'members/css/chat.css' %}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>ChatGPT Clone</title>
</head>
<body>
  <main>
    <div class="view new-chat-view">
      <div class="model-selector">
        <button class="gpt-3 selected">
          <i class="fa fa-bolt"></i> GPT-o4-mini
          <div class="model-info">
            <div class="model-info-box">
              <p>Insert text</p>
              <p class="secondary">Insert text</p>
            </div>
          </div>
        </button>
      </div>
      <div class="logo">
        IPEKA ChatBot
      </div>
    </div>

    <div class="view conversation-view">
      <div class="model-name">
        <i class="fa fa-bolt"></i> GPT-o4-mini
      </div>

      <!-- 🧠 Chat Messages will be added here -->
      <div id="chat-box" class="chat-box"></div>
    </div>

    <!-- ✅ Message Input Form -->
    <div id="message-form">
      <div class="message-wrapper">
        <textarea id="message" rows="1" placeholder="Send a message"></textarea>
        <button class="send-button"><i class="fa fa-paper-plane"></i></button>
      </div>
      <div class="disclaimer">
        This is a ChatGPT UI Clone for personal use and educational purposes only.
      </div>
    </div>
  </main>

  <!-- ✅ Integrated Script -->
  <script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('message');
    const sendBtn = document.querySelector('.send-button');

    function appendMessage(sender, text) {
      const messageDiv = document.createElement('div');
      const senderClass = sender === 'bot' ? 'assistant' : sender;
      messageDiv.className = `${senderClass} message`;

      const identityDiv = document.createElement('div');
      identityDiv.className = 'identity';
      const icon = document.createElement('i');
      icon.className = sender === 'user' ? 'user-icon' : 'gpt user-icon';
      icon.textContent = sender === 'user' ? 'u' : 'G';
      identityDiv.appendChild(icon);

      const contentDiv = document.createElement('div');
      contentDiv.className = 'content';
      const paragraph = document.createElement('p');
      paragraph.textContent = text;
      contentDiv.appendChild(paragraph);

      messageDiv.appendChild(identityDiv);
      messageDiv.appendChild(contentDiv);

      chatBox.appendChild(messageDiv);
      setTimeout(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 0);
    }

    async function sendMessage() {
      const query = input.value.trim();
      if (!query) return;

      // Switch views
      document.querySelector('.new-chat-view').style.display = 'none';
      document.querySelector('.conversation-view').style.display = 'flex';

      appendMessage('user', query);
      input.value = '';
      sendBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:5000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await response.json();
        appendMessage('bot', data.message?.content || 'No response received');
      } catch (error) {
        appendMessage('bot', 'Error contacting server.');
      }

      sendBtn.disabled = false;
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Optional: Autofocus the input on page load
    window.onload = () => {
      input.focus();
    };
  </script>
</body>
</html>
