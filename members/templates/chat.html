<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface Demo</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    {% if user.is_authenticated %}
        <h1>Openrouter Demo</h1>
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>

        <script>
            function sendMessage() {
                var userInput = $('#user-input').val();
                if (userInput.trim() !== '') {
                    $('#chat-messages').append('<p><strong>You:</strong> ' + userInput + '</p>');
                    $('#user-input').val('');

                    $.ajax({
                        url: '{% url "chat" %}',
                        type: 'POST',
                        data: {
                            'message': userInput
                        },
                        success: function(response) {
                            $('#chat-messages').append('<p><strong>AI:</strong> ' + response.message + '</p>');
                        }
                    });
                }
            }

            $('#user-input').keypress(function(e) {
                if (e.which == 13) {
                    sendMessage();
                }
            });
        </script>
    {% else %}
        <h1>Please log in to chat with our bot</h1>
        <a href="{% url 'dashboard' %}">Back to dashboard</a>
    {% endif %}
</body>
</html>
