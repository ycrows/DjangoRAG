{% extends "base.html" %}
{% block content %}
    <h2>Confirm password reset</h2>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Confirm" />
        </form>
    {% else %}
        <h2>Invalid password reset link.</h2>
        <p>This password reset link is invalid. It may have expired or already been used.</p>
    {% endif %}

    <a href="{% url 'dashboard' %}">Back to dashboard</a>
{% endblock content %}
